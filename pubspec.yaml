name: counseling_timer_app
description: "상담용 타이머 앱 - 세션 타이머 + 무음 모드 알람 + 자동 녹음(MP3 변환)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 무음/진동 모드에서도 알람음이 들리도록 오디오 스트림을 지정해 재생
  audioplayers: ^6.1.0

  # 세션 녹음 (AAC로 녹음 후 mp3로 변환)
  record: ^5.1.2

  # 녹음 파일을 mp3로 변환 (원본 ffmpeg_kit_flutter는 2025년에 중단되어
  # 커뮤니티 유지보수 포크인 ffmpeg_kit_flutter_new_min 사용 - 오디오 전용, 용량 작음)
  ffmpeg_kit_flutter_new_min: ^1.6.0

  # 마이크 권한 요청
  permission_handler: ^11.3.1

  # 앱 문서 폴더 경로 (녹음 저장 위치)
  path_provider: ^2.1.4

  # 세션 진행 중 화면이 꺼지지 않도록 유지
  wakelock_plus: ^1.2.8

  # 날짜/시간 포맷 (파일명용)
  intl: ^0.19.0

  # 녹음 파일 공유하기
  share_plus: ^10.1.0

  # 기기 바인딩 라이선스(일련번호) 확인용
  http: ^1.2.2
  shared_preferences: ^2.3.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
