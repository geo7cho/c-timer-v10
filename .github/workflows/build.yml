name: Build APK

# 이 저장소에 코드를 올리거나(push) 수정할 때마다,
# 또는 Actions 탭에서 "Run workflow" 버튼을 눌렀을 때 자동으로 APK를 빌드합니다.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: Flutter 설치
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 안드로이드 네이티브 프로젝트 뼈대 생성
        run: |
          flutter create --platforms=android --org com.counselingtimer --project-name counseling_timer_app .scaffold_tmp
          cp -r .scaffold_tmp/android .
          rm -rf .scaffold_tmp

      - name: 필요한 권한 자동 추가 (마이크 / 화면유지)
        run: |
          python3 - <<'PYEOF'
          import re

          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          permissions = (
              '    <uses-permission android:name="android.permission.INTERNET" />\n'
              '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n'
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
              '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
          )

          if "RECORD_AUDIO" not in content:
              content = re.sub(
                  r"(<manifest[^>]*>)",
                  r"\1\n" + permissions,
                  content,
                  count=1,
              )
              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)
              print("권한 추가 완료")
          else:
              print("이미 권한이 있음 - 건너뜀")
          PYEOF

      - name: 최소 안드로이드 버전 조정 (mp3 변환 라이브러리 요구사항)
        run: |
          python3 - <<'PYEOF'
          import glob
          import re

          # ffmpeg_kit_flutter_new_min(mp3 변환)은 안드로이드 API 24 이상을 요구합니다.
          # flutter create로 새로 만든 프로젝트는 기본값이 그보다 낮아서,
          # 녹음은 되지만 mp3 변환만 조용히 실패하는 원인이 됩니다.
          candidates = (
              glob.glob("android/app/build.gradle.kts")
              + glob.glob("android/app/build.gradle")
          )
          if not candidates:
              raise SystemExit("android/app/build.gradle(.kts) 파일을 찾을 수 없습니다")

          path = candidates[0]
          with open(path, encoding="utf-8") as f:
              content = f.read()

          if path.endswith(".kts"):
              new_content, n = re.subn(r"minSdk\s*=\s*[^\n]+", "minSdk = 24", content)
          else:
              new_content, n = re.subn(r"minSdkVersion\s+\S+", "minSdkVersion 24", content)

          if n == 0:
              raise SystemExit(f"{path} 에서 minSdk 설정 줄을 찾지 못했습니다")

          with open(path, "w", encoding="utf-8") as f:
              f.write(new_content)
          print(f"{path} 의 minSdk를 24로 설정 완료 ({n}곳 변경)")
          PYEOF

      - name: 패키지 설치
        run: flutter pub get

      - name: 릴리즈 APK 빌드
        run: flutter build apk --release

      - name: APK 업로드 (Actions 실행 결과의 Artifacts에서 다운로드)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
